apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizuki
  namespace: mizuki
  labels:
    app: mizuki
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mizuki
  template:
    metadata:
      labels:
        app: mizuki
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: nfs-share
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nfs-share
        persistentVolumeClaim:
          claimName: mizuki-content
