apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: shirone-uploads-retain
  labels:
    app.kubernetes.io/part-of: shirone-strapi
provisioner: cluster.local/nfs-subdir-external-provisioner
parameters:
  archiveOnDelete: "true"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shirone-uploads
  namespace: mizuki
  labels:
    app.kubernetes.io/part-of: shirone-strapi
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shirone-uploads-retain
  resources:
    requests:
      storage: 5Gi
