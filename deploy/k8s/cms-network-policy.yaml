apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shirone-cms-private-ingress
  namespace: mizuki
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  podSelector:
    matchLabels: {app: shirone-cms}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: shirone-ssr}
      ports:
        - {protocol: TCP, port: 1337}
