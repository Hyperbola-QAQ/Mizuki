apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shirone-cms-gateway-ingress
  namespace: mizuki
  labels: {app.kubernetes.io/part-of: shirone-strapi}
spec:
  podSelector:
    matchLabels: {app: shirone-cms}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: higress-system}
          podSelector:
            matchLabels: {app: higress-gateway}
      ports:
        - {protocol: TCP, port: 1337}
