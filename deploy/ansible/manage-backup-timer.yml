---
- name: Manage the dedicated Shirone user-level backup timer on the controller
  hosts: localhost
  gather_facts: false
  vars:
    shirone_backup_install_dir: /home/hyperbola/Work/ansible-debian-k8s/files/shirone-backup
    shirone_runtime_stage: /home/hyperbola/.local/state/shirone-strapi/runtime-stage
    shirone_backup_destination: /home/hyperbola/.local/state/shirone-strapi/primary-backups
    shirone_kube_system_uid: ''
    shirone_mizuki_uid: ''
    shirone_enable_backup_timer: false
  tasks:
    - name: Require controller paths and reviewed cluster identities
      ansible.builtin.assert:
        that:
          - lookup('env', 'SHIRONE_WORKSPACE') | length > 0
          - shirone_backup_install_dir == '/home/hyperbola/Work/ansible-debian-k8s/files/shirone-backup'
          - shirone_runtime_stage == '/home/hyperbola/.local/state/shirone-strapi/runtime-stage'
          - shirone_backup_destination == '/home/hyperbola/.local/state/shirone-strapi/primary-backups'
          - shirone_kube_system_uid | length > 0
          - shirone_mizuki_uid | length > 0
        quiet: true
    - name: Prepare the project-owned controller script directory
      ansible.builtin.file:
        path: "{{ shirone_backup_install_dir }}"
        state: directory
        mode: '0700'
      when: shirone_enable_backup_timer | bool
    - name: Install the reviewed backup scripts from the project
      ansible.builtin.copy:
        src: "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/tools/{{ item }}"
        dest: "{{ shirone_backup_install_dir }}/{{ item }}"
        mode: '0600'
      loop: [backup_primary.py, db_credential_stage.py, runtime_secret_stage.py, runtime_secret_kubectl.py, runtime_secret_replicate.py]
      when: shirone_enable_backup_timer | bool
    - name: Prepare the user's systemd unit directory
      ansible.builtin.file:
        path: /home/hyperbola/.config/systemd/user
        state: directory
        mode: '0755'
      when: shirone_enable_backup_timer | bool
    - name: Install only Shirone's service and timer
      ansible.builtin.template:
        src: "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/systemd/{{ item }}.j2"
        dest: "/home/hyperbola/.config/systemd/user/{{ item }}"
        mode: '0644'
      loop: [shirone-primary-backup.service, shirone-primary-backup.timer]
      when: shirone_enable_backup_timer | bool
    - name: Enable the dedicated backup timer
      ansible.builtin.systemd_service:
        scope: user
        name: shirone-primary-backup.timer
        daemon_reload: true
        enabled: true
        state: started
      when: shirone_enable_backup_timer | bool and not ansible_check_mode
