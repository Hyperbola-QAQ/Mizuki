---
- name: Manage create-only Shirone runtime credentials
  hosts: localhost
  gather_facts: false
  vars:
    shirone_runtime_action: preview
    shirone_runtime_stage: ''
    shirone_kube_system_uid: ''
    shirone_mizuki_uid: ''
    shirone_allow_runtime_production: false
  tasks:
    - name: Validate the requested action and external private stage
      ansible.builtin.assert:
        that:
          - lookup('env', 'SHIRONE_WORKSPACE') | length > 0
          - shirone_runtime_action in ['preview', 'init', 'apply']
          - shirone_runtime_stage is match('^/')
          - shirone_runtime_stage != lookup('env', 'SHIRONE_WORKSPACE')
          - not shirone_runtime_stage.startswith(lookup('env', 'SHIRONE_WORKSPACE') + '/')
          - shirone_runtime_action != 'apply' or (shirone_allow_runtime_production | bool and shirone_kube_system_uid | length > 0 and shirone_mizuki_uid | length > 0)
        quiet: true
    - name: Initialize the durable stage without contacting Kubernetes
      ansible.builtin.command:
        argv: [python3, "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/tools/runtime_secret_kubectl.py", init, --stage, "{{ shirone_runtime_stage }}"]
      when: shirone_runtime_action == 'init' and not ansible_check_mode
      no_log: true
    - name: Verify two recovery copies and apply create-only Secrets
      ansible.builtin.command:
        argv: [python3, "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/tools/runtime_secret_kubectl.py", apply, --stage, "{{ shirone_runtime_stage }}", --cluster-uid, "{{ shirone_kube_system_uid }}", --namespace-uid, "{{ shirone_mizuki_uid }}", --allow-production]
      when: shirone_runtime_action == 'apply' and not ansible_check_mode
      no_log: true
