---
- name: Install the existing scoped reader token without reissuing it
  hosts: localhost
  gather_facts: false
  vars:
    shirone_bootstrap_stage: ''
    shirone_kube_system_uid: ''
    shirone_mizuki_uid: ''
    shirone_apply_reader_secret: false
  tasks:
    - name: Require reviewed identities and an external private stage
      ansible.builtin.assert:
        that:
          - lookup('env', 'SHIRONE_WORKSPACE') | length > 0
          - shirone_bootstrap_stage is match('^/')
          - shirone_bootstrap_stage != lookup('env', 'SHIRONE_WORKSPACE')
          - not shirone_bootstrap_stage.startswith(lookup('env', 'SHIRONE_WORKSPACE') + '/')
          - shirone_kube_system_uid | length > 0
          - shirone_mizuki_uid | length > 0
        quiet: true
    - name: Verify recovery copies and create only the reader Secret
      ansible.builtin.command:
        argv: [python3, "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/tools/reader_secret_kubectl.py", --stage, "{{ shirone_bootstrap_stage }}", --cluster-uid, "{{ shirone_kube_system_uid }}", --namespace-uid, "{{ shirone_mizuki_uid }}", --allow-production]
      when: shirone_apply_reader_secret | bool and not ansible_check_mode
      no_log: true
