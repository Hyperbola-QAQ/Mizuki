---
# Create-only credential transaction. Default is a non-mutating preview.
# The Python helper never prints Secret contents, and uncertain requests HOLD.
- name: Manage Shirone CMS database credentials
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    shirone_credential_action: preview
    shirone_stage_dir: ''
    shirone_cluster_uid: ''
    shirone_db_namespace: databases
    shirone_cms_namespace: mizuki
    shirone_db_namespace_uid: ''
    shirone_cms_namespace_uid: ''
    shirone_allow_production: false
    shirone_credential_tool: "{{ lookup('env', 'SHIRONE_WORKSPACE') }}/deploy/tools/db_credential_kubectl.py"
  tasks:
    - name: Validate explicit transaction parameters
      ansible.builtin.assert:
        that:
          - shirone_credential_action in ['preview', 'init', 'apply']
          - lookup('env', 'SHIRONE_WORKSPACE') | length > 0
          - shirone_stage_dir is match('^/')
          - shirone_credential_action != 'apply' or shirone_cluster_uid | length > 0
          - shirone_credential_action != 'apply' or shirone_db_namespace_uid | length > 0
          - shirone_credential_action != 'apply' or shirone_cms_namespace_uid | length > 0
          - >-
            shirone_credential_action != 'apply' or
            (shirone_db_namespace != 'databases' or shirone_cms_namespace != 'mizuki') or
            shirone_allow_production | bool
        quiet: true

    - name: Report that preview does not create credentials or Secrets
      ansible.builtin.debug:
        msg: "Preview only: no credential stage or Kubernetes Secret will be created."
      when: shirone_credential_action == 'preview' or ansible_check_mode

    - name: Initialize an explicit empty protected local stage
      ansible.builtin.command:
        argv:
          - python3
          - "{{ shirone_credential_tool }}"
          - init
          - --stage
          - "{{ shirone_stage_dir }}"
      when: shirone_credential_action == 'init' and not ansible_check_mode
      no_log: true

    - name: Reconcile create-only credentials against reviewed object identities
      ansible.builtin.command:
        argv: >-
          {{ ['python3', shirone_credential_tool, 'apply', '--stage', shirone_stage_dir,
              '--cluster-uid', shirone_cluster_uid,
              '--db-namespace', shirone_db_namespace, '--cms-namespace', shirone_cms_namespace,
              '--db-namespace-uid', shirone_db_namespace_uid,
              '--cms-namespace-uid', shirone_cms_namespace_uid]
              + (['--allow-production'] if shirone_allow_production | bool else []) }}
      when: shirone_credential_action == 'apply' and not ansible_check_mode
      no_log: true
