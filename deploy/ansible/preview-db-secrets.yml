---
# Synthetic validation only: no real credential is read, generated, or stored.
- name: Preview isolated CMS database Secret schemas without writes
  hosts: "{{ shirone_preview_hosts | default('bootstrap_control_plane') }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    shirone_kubeconfig: /home/hyperbola/.kube/config
    # An explicitly synthetic value: it cannot authenticate to a real database.
    shirone_preview_password: dry-run-only-not-a-real-credential
  tasks:
    - name: Restrict preview to the reviewed kubeconfig path
      ansible.builtin.assert:
        that:
          - shirone_kubeconfig == '/home/hyperbola/.kube/config'
        quiet: true

    - name: Validate both namespace Secret objects without persisting them
      ansible.builtin.command:
        argv:
          - kubectl
          - --request-timeout=15s
          - "--kubeconfig={{ shirone_kubeconfig }}"
          - --namespace={{ item }}
          - create
          - --dry-run=server
          - -f
          - '-'
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'shirone-cms-db', 'namespace': item,
                           'labels': {'app.kubernetes.io/part-of': 'shirone-strapi'}},
              'type': 'kubernetes.io/basic-auth', 'immutable': true,
              'stringData': {'username': 'shirone_cms',
                             'password': shirone_preview_password}} | to_json }}
      loop:
        - databases
        - mizuki
      changed_when: false
      check_mode: false
      no_log: true

    - name: Report the preview without displaying Secret data
      ansible.builtin.debug:
        msg: "Both synthetic Secret schemas passed server-side dry-run; no credential or resource was created."
