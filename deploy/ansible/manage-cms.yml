---
- name: Create the isolated Shirone CMS without changing ingress
  hosts: "{{ shirone_preview_hosts | default('bootstrap_control_plane') }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    shirone_kubeconfig: /home/hyperbola/.kube/config
    shirone_kube_system_uid: ''
    shirone_mizuki_uid: ''
    shirone_cms_secret_uid: ''
    shirone_db_secret_uid: ''
    shirone_uploads_uid: ''
    shirone_database_uid: ''
    shirone_apply_cms: false
  tasks:
    - name: Require reviewed identities and workspace
      ansible.builtin.assert:
        that:
          - lookup('env', 'SHIRONE_WORKSPACE') | length > 0
          - shirone_kube_system_uid | length > 0
          - shirone_mizuki_uid | length > 0
          - shirone_cms_secret_uid | length > 0
          - shirone_db_secret_uid | length > 0
          - shirone_uploads_uid | length > 0
          - shirone_database_uid | length > 0
          - shirone_kubeconfig == '/home/hyperbola/.kube/config'
        quiet: true
    - name: Check namespaces, credentials, claim and database identity
      ansible.builtin.command:
        argv: "{{ ['kubectl','--request-timeout=15s','--kubeconfig=' + shirone_kubeconfig] + item.args + ['-o','jsonpath={.metadata.uid}'] }}"
      loop:
        - {args: [get, namespace, kube-system], expected: "{{ shirone_kube_system_uid }}"}
        - {args: [get, namespace, mizuki], expected: "{{ shirone_mizuki_uid }}"}
        - {args: [-n, mizuki, get, secret, shirone-cms], expected: "{{ shirone_cms_secret_uid }}"}
        - {args: [-n, mizuki, get, secret, shirone-cms-db], expected: "{{ shirone_db_secret_uid }}"}
        - {args: [-n, mizuki, get, pvc, shirone-uploads], expected: "{{ shirone_uploads_uid }}"}
        - {args: [-n, databases, get, databases.postgresql.cnpg.io, shirone-cms], expected: "{{ shirone_database_uid }}"}
      register: identities
      changed_when: false
      check_mode: false
    - name: Refuse identity mismatches
      ansible.builtin.assert:
        that: [item.stdout == item.item.expected]
        quiet: true
      loop: "{{ identities.results }}"
    - name: Read pinned candidate resources
      ansible.builtin.set_fact:
        candidates: "{{ lookup('file', lookup('env', 'SHIRONE_WORKSPACE') + '/deploy/k8s/cms.yaml') | from_yaml_all | list }}"
    - name: Restrict resource identities and single-writer storage
      ansible.builtin.assert:
        that:
          - candidates | length == 2
          - candidates[0].kind == 'Deployment'
          - candidates[0].metadata.namespace == 'mizuki'
          - candidates[0].metadata.name == 'shirone-cms'
          - candidates[0].spec.replicas == 1
          - candidates[0].spec.strategy.type == 'Recreate'
          - candidates[0].spec.template.spec.volumes[0].persistentVolumeClaim.claimName == 'shirone-uploads'
          - candidates[1].kind == 'Service'
          - candidates[1].metadata.namespace == 'mizuki'
          - candidates[1].metadata.name == 'shirone-cms'
        quiet: true
    - name: Detect pre-existing resources
      ansible.builtin.command:
        argv: [kubectl, --request-timeout=15s, "--kubeconfig={{ shirone_kubeconfig }}", -n, mizuki, get, "{{ item.kind }}", "{{ item.metadata.name }}", --ignore-not-found, -o, name]
      loop: "{{ candidates }}"
      register: existing
      changed_when: false
      check_mode: false
    - name: Refuse to adopt or overwrite an existing resource
      ansible.builtin.assert:
        that: [item.stdout | length == 0]
        quiet: true
      loop: "{{ existing.results }}"
    - name: Run server-side admission checks
      ansible.builtin.command:
        argv: [kubectl, --request-timeout=15s, "--kubeconfig={{ shirone_kubeconfig }}", create, --dry-run=server, -f, '-', -o, name]
        stdin: "{{ item | to_json }}"
      loop: "{{ candidates }}"
      changed_when: false
      check_mode: false
    - name: Create only the dedicated CMS deployment and service
      ansible.builtin.command:
        argv: [kubectl, --request-timeout=15s, "--kubeconfig={{ shirone_kubeconfig }}", create, -f, '-', -o, name]
        stdin: "{{ item | to_json }}"
      loop: "{{ candidates }}"
      when: shirone_apply_cms | bool and not ansible_check_mode
